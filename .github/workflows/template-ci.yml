name: template-ci
on:
  push:
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]   # weekly: against the latest crates.io UC
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-generate }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: rustup toolchain install 1.89.0 --profile minimal --component clippy
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }
      - run: pip3 install --user ansible-core ziglang
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-zigbuild }
      - run: CLOUD_REQUIRE_CROSS=1 CLOUD_REQUIRE_TOOLS=1 bash template-tests/cloud.sh
      - run: bash template-tests/generator.sh
      - run: bash template-tests/lint-determinism.sh
      - run: bash template-tests/tree-hash.sh
      - run: bash template-tests/hook.sh
      - run: bash template-tests/uc-upgrade.sh
      - name: generate + full project CI
        run: |
          D="$HOME/scratch/uc_starter-gen/ci"; rm -rf "$D"; template-tests/gen.sh "$D"
          cd "$D/demo-app"
          if [ "${{ github.event_name }}" = schedule ]; then
            # Only a non-yanked line: the sparse index keeps yanked releases,
            # and jq's per-line streaming means the last matching line is the
            # newest non-yanked version (index order is release order).
            latest="$(curl -fsA 'uc_starter-ci' https://index.crates.io/uc/_s/uc_service | jq -r 'select(.yanked==false) | .vers' | tail -1)"
            scripts/uc-upgrade.sh "$latest"
          fi
          make bins lint test test-cluster
      - run: bash template-tests/tutor.sh
      - if: failure() && github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --title "template-ci weekly: starter broken against latest ultima_cluster" --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-generate }
      # NOT $GITHUB_WORKSPACE/gen: cargo-generate walks up from the
      # destination looking for a workspace and trips on THIS repo's own
      # Cargo.toml (still the unprocessed `{{project-name}}` placeholder,
      # since this checkout is the template, not a generated project) —
      # confirmed by a real failed run. Generate outside the checkout, as
      # every other job does, and point devcontainers/ci at it with
      # `checkoutPath` (an absolute root of its own), not `subFolder`
      # (repo-relative only).
      - run: |
          D="$HOME/scratch/uc_starter-gen/dc"; rm -rf "$D"; template-tests/gen.sh "$D"
          echo "P=$D/demo-app" >> "$GITHUB_ENV"
      - uses: devcontainers/ci@v0.3
        with:
          checkoutPath: ${{ env.P }}
          runCmd: make bins test-cluster
  macos-package:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-generate,cargo-zigbuild" }
      - run: brew install zig
      - name: generate, then package for both CPUs under macOS's /bin/bash
        run: |
          D="$HOME/scratch/uc_starter-gen/mac"; rm -rf "$D"; template-tests/gen.sh "$D"
          cd "$D/demo-app"
          for a in x86_64 aarch64; do
            b="$(HOSTS=10.0.0.1,10.0.0.2,10.0.0.3 GATEWAYS=203.0.113.1,203.0.113.2,203.0.113.3 ARCH=$a /bin/bash scripts/package.sh | head -1)"
            mkdir -p "x-$a"; tar xzf "$b" -C "x-$a"
            want=x86-64; [ $a = aarch64 ] && want=aarch64
            for f in x-$a/*/bin/*; do file -b "$f" | grep -q "ELF 64-bit.*$want" || { echo "FAIL $f: $(file -b "$f")"; exit 1; }; done
            ! tar tzf "$b" | grep -q '/\._' || { echo "FAIL: ._ files in $b"; exit 1; }
          done
          echo "macos-package: PASS"
