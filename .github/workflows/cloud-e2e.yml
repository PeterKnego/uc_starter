name: cloud-e2e
# Manual: a real cloud-oneshot on the chosen cloud (costs money; minutes of
# three small hosts). Needs the cloud's secrets in this repo.
on:
  workflow_dispatch:
    inputs:
      cloud: { description: "hetzner | aws | gcp", required: true, default: hetzner }
      arch: { description: "x86_64 | aarch64", required: true, default: x86_64 }
permissions: { contents: read }
concurrency: { group: cloud-e2e, cancel-in-progress: false }
jobs:
  oneshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-generate,cargo-zigbuild" }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }
      - run: pip3 install --user ansible-core ziglang
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: generate a project and its tfvars
        env: { GCP_SA_JSON: "${{ secrets.GCP_SA_JSON }}" }
        run: |
          D="$HOME/scratch/uc_starter-gen/e2e"; rm -rf "$D"; template-tests/gen.sh "$D"
          P="$D/demo-app"; echo "P=$P" >> "$GITHUB_ENV"
          if [ "${{ inputs.cloud }}" = gcp ]; then
            printf '%s' "$GCP_SA_JSON" > "$HOME/gcp.json"; echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp.json" >> "$GITHUB_ENV"
          fi
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/cloud_e2e"
          ip="$(curl -fsS https://checkip.amazonaws.com)"
          cat > "$P/cloud-infra/terraform.tfvars" <<EOF
          cloud                = "${{ inputs.cloud }}"
          arch                 = "${{ inputs.arch }}"
          ssh_public_key       = "$(cat "$HOME/.ssh/cloud_e2e.pub")"
          ssh_private_key_file = "$HOME/.ssh/cloud_e2e"
          allow_ssh_cidr       = "$ip/32"
          ttl_hours            = 1
          EOF
      - run: cd "$P" && make bins && TF_VAR_owner="uce2e-${{ github.run_id }}" make cloud-oneshot
      - if: always()
        run: cd "$P" && TF_VAR_owner="uce2e-${{ github.run_id }}" make cloud-destroy
      - if: always()
        run: rm -f "$HOME/gcp.json"
